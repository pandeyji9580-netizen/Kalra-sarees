<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalra Sarees & Suits</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#fff8f5;color:#333}
header{background:#171313;padding:8px 4%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{height:78px;max-width:230px;object-fit:contain}
.cart-btn{background:#d4a72c;color:#fff;border:0;padding:12px 17px;border-radius:25px;font-weight:bold;cursor:pointer}
.hero{text-align:center;padding:52px 18px;background:linear-gradient(135deg,#8b1e3f,#c94b70);color:#fff}
.hero h1{font-size:38px;margin-bottom:10px}.hero p{font-size:18px;margin-bottom:24px}
.shop{display:inline-block;background:#fff;color:#8b1e3f;padding:12px 26px;border-radius:25px;text-decoration:none;font-weight:bold}
.search{text-align:center;padding:24px 12px}.search input{width:92%;max-width:520px;padding:13px;border:1px solid #ddd;border-radius:25px;font-size:16px}
.products{padding:20px 5%}.products h2{text-align:center;color:#8b1e3f;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.product{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px #0002}
.product img{width:100%;height:250px;object-fit:cover}.info{padding:15px}.info h3{color:#8b1e3f}
.price{font-size:19px;font-weight:bold;margin:10px 0}.add{width:100%;padding:11px;background:#8b1e3f;color:#fff;border:0;border-radius:7px;cursor:pointer}
.cart{position:fixed;right:-420px;top:0;width:390px;max-width:95%;height:100vh;background:#fff;z-index:20;padding:20px;box-shadow:-5px 0 20px #0004;transition:.3s;overflow-y:auto}.cart.open{right:0}
.carthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{border:0;padding:8px 12px;cursor:pointer}
.item{padding:12px 0;border-bottom:1px solid #ddd}.qty button{padding:5px 10px;border:0;margin-top:7px;cursor:pointer}
.total{font-size:20px;font-weight:bold;color:#8b1e3f;margin:20px 0}
.checkout{display:none}.checkout.show{display:block}.checkout input,.checkout textarea,.checkout select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:7px}
.order{width:100%;padding:13px;background:#198754;color:#fff;border:0;border-radius:7px;margin-top:8px;cursor:pointer;font-size:16px}
footer{background:#171313;color:#fff;text-align:center;padding:25px;margin-top:40px}
@media(max-width:500px){.logo{height:60px;max-width:175px}.hero h1{font-size:30px}.cart{width:95%}}

.admin{position:fixed;inset:0;background:#0008;z-index:30;display:none;padding:15px;overflow-y:auto}
.admin.open{display:block}
.admin-box{background:#fff;max-width:600px;margin:30px auto;border-radius:14px;padding:20px}
.admin-box input[type="text"],.admin-box input[type="number"],.admin-box input[type="file"]{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:7px}
.saved-product{display:flex;gap:10px;align-items:center;border:1px solid #ddd;border-radius:9px;padding:9px;margin:8px 0}
.saved-product img{width:55px;height:65px;object-fit:cover;border-radius:6px}
.delete-product{margin-left:auto;background:#dc3545;color:white;border:0;padding:8px 10px;border-radius:6px;cursor:pointer}
@media(max-width:600px){header{gap:6px}.logo{max-width:130px}header .cart-btn{padding:9px 10px;font-size:12px}.admin-box{margin:10px auto}}

</style>
</head>

<div style="display:flex;gap:8px;align-items:center">
<button class="cart-btn" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button>
</div>
</header>

<section class="hero">
<h1>Kalra Sarees & Suits</h1>
<p>Beautiful Sarees & Suits for Every Occasion</p>
<a class="shop" href="#products">Shop Now</a>
</section>

<div class="search"><input id="search" placeholder="🔎 Saree ya Suit search karein..." onkeyup="searchProducts()"></div>

<section class="products" id="products">
<h2>Our Collection</h2>
<div class="grid" id="productGrid"></div>
</section>


<div class="cart" id="cart">
<div class="carthead"><h2>Your Cart</h2><button class="close" onclick="closeCart()">✕</button></div>
<div id="cartItems"></div>
<div class="total">Total: ₹<span id="total">0</span></div>
<button class="order" onclick="showCheckout()">Proceed to Order</button>
<div class="checkout" id="checkout">
<h3 style="margin-top:20px">Customer Details</h3>
<input id="name" placeholder="Your Name">
<input id="phone" type="tel" placeholder="Mobile Number">
<textarea id="address" rows="4" placeholder="Delivery Address"></textarea>
<select id="payment"><option>Cash on Delivery</option><option>Online Payment</option></select>
<button class="order" onclick="placeOrder()">📱 Place Order on WhatsApp</button>
</div>
</div>

<footer><h3>Kalra Sarees & Suits</h3><p>Quality • Style • Trust</p><p>© 2026 Kalra Sarees & Suits</p></footer>

<script>
const defaultProducts=[
{id:1,name:"Royal Banarasi Saree",category:"Saree",price:2499,image:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=600&q=80"},
{id:2,name:"Designer Silk Saree",category:"Saree",price:2999,image:"https://images.unsplash.com/photo-1583391733956-6c78276477e2?auto=format&fit=crop&w=600&q=80"},
{id:3,name:"Party Wear Suit",category:"Suit",price:1899,image:"https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?auto=format&fit=crop&w=600&q=80"},
{id:4,name:"Elegant Punjabi Suit",category:"Suit",price:1599,image:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=600&q=80"},
{id:5,name:"Wedding Special Saree",category:"Saree",price:3499,image:"https://images.unsplash.com/photo-1610189012906-d9d7e9e8c9d4?auto=format&fit=crop&w=600&q=80"},
{id:6,name:"Embroidered Suit",category:"Suit",price:2199,image:"https://images.unsplash.com/photo-1609357605129-26f69add5d6e?auto=format&fit=crop&w=600&q=80"},
{id:7,name:"Festive Saree",category:"Saree",price:2799,image:"https://images.unsplash.com/photo-1585488436897-3e9d5b3f4e0c?auto=format&fit=crop&w=600&q=80"},
{id:8,name:"Cotton Daily Wear Suit",category:"Suit",price:999,image:"https://images.unsplash.com/photo-1596755389378-c31d21fd1273?auto=format&fit=crop&w=600&q=80"}
];

let products = JSON.parse(localStorage.getItem("kalraProducts") || "null") || defaultProducts;
let cart=[];

function displayProducts(list=products){
let g=document.getElementById("productGrid");g.innerHTML="";
list.forEach(p=>g.innerHTML+=`<div class="product"><img src="${p.image}" alt="${p.name}"><div class="info"><h3>${p.name}</h3><div class="price">₹${p.price}</div><button class="add" onclick="addToCart(${p.id})">Add to Cart</button></div></div>`);
}
function addToCart(id){let p=products.find(x=>x.id===id),i=cart.find(x=>x.id===id);i?i.qty++:cart.push({...p,qty:1});updateCart();openCart()}
function updateCart(){
let box=document.getElementById("cartItems"),total=0,count=0;box.innerHTML="";
cart.forEach(i=>{let a=i.price*i.qty;total+=a;count+=i.qty;box.innerHTML+=`<div class="item"><b>${i.name}</b><br>₹${i.price} × ${i.qty}<div class="qty"><button onclick="changeQty(${i.id},-1)">−</button> <button onclick="changeQty(${i.id},1)">+</button></div></div>`});
document.getElementById("total").textContent=total;document.getElementById("count").textContent=count;
}
function changeQty(id,c){let i=cart.find(x=>x.id===id);if(!i)return;i.qty+=c;if(i.qty<=0)cart=cart.filter(x=>x.id!==id);updateCart()}
function openCart(){document.getElementById("cart").classList.add("open")}
function closeCart(){document.getElementById("cart").classList.remove("open")}
function searchProducts(){let q=document.getElementById("search").value.trim().toLowerCase(); if(!q){displayProducts(products);return;} displayProducts(products.filter(p=>(p.name||"").toLowerCase().includes(q)||(p.category||"").toLowerCase().includes(q)))}
function showCheckout(){if(!cart.length)return alert("Pehle product cart mein add karein.");document.getElementById("checkout").classList.add("show")}
function placeOrder(){
let name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),address=document.getElementById("address").value.trim(),payment=document.getElementById("payment").value;
if(!name||!phone||!address)return alert("Please complete customer details.");
let msg =
"🛍️ *NEW ORDER - KALRA SAREES & SUITS*\n\n" +
"👤 *Customer Name:* " + name + "\n" +
"📱 *Customer Mobile:* " + phone + "\n" +
"📍 *Delivery Address:* " + address + "\n" +
"💳 *Payment:* " + payment + "\n\n" +
"🛒 *ORDER DETAILS*\n";

let total = 0;

cart.forEach(i => {
    let a = i.price * i.qty;
    total += a;
    msg += "• " + i.name + " × " + i.qty + " = ₹" + a + "\n";
});

msg += "\n💰 *TOTAL: ₹" + total + "*";

const whatsappMessage = encodeURIComponent(msg);

window.open(
    "https://wa.me/919559037503?text=" + whatsappMessage,
    "_blank"
);
}
displayProducts();updateCart();
</script>
